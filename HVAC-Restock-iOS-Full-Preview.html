x}.settingsrow{width:100%;border:0;background:#fff;text-align:left;min-height:50px;padding:0 14px;border-bottom:1px solid #e2e8eb;display:flex;align-items:center;justify-content:space-between}.settingsrow:last-child{border-bottom:0}.settingsrow span:last-child{color:var(--muted);font-size:13px}.settingsrow .rowlabel{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:inherit}.settingsrow .rowlabel .bi{width:16px;color:var(--blue)}.notice{padding:11px 13px;border-radius:12px;background:#fff3dc;color:#795210;font-size:12px;line-height:1.4;margin-bottom:12px}.toast{position:absolute;bottom:88px;left:16px;right:16px;background:#182a33ed;color:#fff;border-radius:13px;padding:12px 14px;z-index:80;font-size:13px;box-shadow:0 8px 24px #08131944}.tablet .toast{left:auto;right:28px;bottom:24px;width:340px}.hidden{display:none!important}

<body>
<main class="page">
  <header class="intro">
    <div><div class="eyebrow">Full interactive product preview</div><h1>HVAC Restock</h1><p>Use a part. The supply-house list updates automatically.</p></div>
    <div class="legend"><span class="pill">Local-only</span><span class="pill">CSV</span><span class="pill">No account</span><span class="pill">$14.99 once</span></div>
  </header>
  <section class="devices">
    <div><div class="device-label">iPhone · 390 × 844</div><div class="phone-shell"><div class="screen phone" id="phone"></div><div class="homebar"></div></div></div>
    <div><div class="device-label">iPad · adaptive two-column layout</div><div class="tablet-shell"><div class="screen tablet" id="tablet"></div></div></div>
  </section>
</main>
<script>
const seed=[
 {id:1,name:'45/5 MFD dual run capacitor',part:'CAP-455',cat:'Capacitor',loc:'Bin A',qty:1,at:1,to:4},
 {id:2,name:'2-pole 40A contactor',part:'CTR-240',cat:'Contactor',loc:'Bin B',qty:2,at:1,to:3},
 {id:3,name:'3A blade fuse',part:'FUSE-3A',cat:'Fuse',loc:'Drawer 1',qty:0,at:2,to:8},
 {id:4,name:'20×20×1 pleated filter',part:'FLT-20201',cat:'Filter',loc:'Filter rack',qty:1,at:2,to:6},
 {id:5,name:'Universal condenser fan motor',part:'MTR-UCFM',cat:'Motor',loc:'Rear shelf',qty:2,at:1,to:3},
 {id:6,name:'1/4 in flare nuts',part:'FTG-14FN',cat:'Fitting',loc:'Small parts',qty:12,at:4,to:20},
 {id:7,name:'18/5 thermostat wire',part:'WIRE-185',cat:'Consumable',loc:'Door rack',qty:2,at:1,to:4},
 {id:8,name:'Programmable thermostat',part:'TSTAT-PRO',cat:'Thermostat',loc:'Top shelf',qty:2,at:1,to:3},
 {id:9,name:'PVC condensate tablets',part:'TAB-COND',cat:'Consumable',loc:'Drawer 3',qty:5,at:2,to:10}
];
const seedEvents=[
 {id:101,itemID:3,item:'3A blade fuse',kind:'Used',delta:-1,result:0,time:'Today, 1:42 PM',reversed:false},
 {id:102,itemID:1,item:'45/5 MFD dual run capacitor',kind:'Used',delta:-1,result:1,time:'Today, 11:18 AM',reversed:false},
 {id:103,itemID:4,item:'20×20×1 pleated filter',kind:'Stocked',delta:4,result:5,time:'Yesterday, 4:06 PM',reversed:false}
];
let items=structuredClone(seed),events=structuredClone(seedEvents),unlocked=false;
let nextID=1000;
const MAX_QUANTITY=999999,FREE_LIMIT=10;
const ui={phone:{tab:'stock',modal:null,edit:null,query:'',returnModal:null},tablet:{tab:'stock',modal:null,edit:null,query:'',returnModal:null}};
const I=name=>`<i class="bi bi-${name}" aria-hidden="true"></i>`;
const icon={stock:I('box-seam'),restock:I('cart3'),activity:I('clock-history')};
const importRows=[
 {name:'45/5 MFD dual run capacitor',part:'CAP-455',cat:'Capacitor',loc:'Bin A',qty:2,at:1,to:4},
 {name:'5A blade fuse',part:'FUSE-5A',cat:'Fuse',loc:'Drawer 1',qty:6,at:2,to:8},
 {name:'Drain pan switch',part:'DPS-01',cat:'Other',loc:'Bin C',qty:1,at:1,to:3}
];
const h=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const a=h;
const newID=()=>++nextID;
const normalize=value=>Array.from(String(value??'').trim()).slice(0,120).join('');
const duplicateKey=x=>[x.name,x.part,x.cat,x.loc].map(v=>normalize(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('en-US')).join('|');
const validQuantity=value=>Number.isInteger(value)&&value>=0&&value<=MAX_QUANTITY;
const safeAdd=(current,delta)=>Number.isInteger(delta)&&validQuantity(current)&&validQuantity(current+delta)?current+delta:null;
const makeEvent=(item,kind,delta,result,reversed=false)=>({id:newID(),itemID:item.id,item:item.name,kind,delta,result,time:'Just now',reversed});
const low=()=>items.filter(x=>x.qty<=x.at);
function statusbar(){return `<div class="statusbar"><span>9:41</span><span class="status-icons">${I('reception-4')}${I('wifi')}${I('battery-full')}</span></div>`}
function summary(){return `<div class="summary"><div class="tile"><strong>${items.length}</strong><span>Items</span></div><div class="tile low"><strong>${low().length}</strong><span>Low</span></div><div class="tile out"><strong>${items.filter(x=>x.qty===0).length}</strong><span>Out</span></div></div>${unlocked?'<div class="limit">Lifetime access unlocked</div>':`<div class="limit">${items.length} of 10 free items used</div>`}`}
function card(x,d){let state=x.qty===0?'out':x.qty<=x.at?'low':'';return `<article class="card stock-card"><div class="itemtop"><div><div class="name">${h(x.name)}</div><div class="part">${h(x.part)}</div><div class="meta">${h(x.cat)}${x.loc?' · '+h(x.loc):''}</div></div><div class="qty ${state}"><strong>${x.qty}</strong>${state?`<span class="tag ${state==='out'?'red':''}">${state==='out'?'Out':'Low'}</span>`:''}</div></div><div class="actions"><button class="primary" ${x.qty===0?'disabled':''} onclick="useOne('${d}',${x.id})">Used</button><button class="secondary" aria-label="Add one" onclick="addOne('${d}',${x.id})">${I('plus-lg')}</button><button class="secondary" aria-label="Edit" onclick="openEdit('${d}',${x.id})">${I('pencil')}</button></div></article>`}
function stock(d){let q=ui[d].query.toLocaleLowerCase('en-US'),visible=items.filter(x=>[x.name,x.part,x.cat,x.loc].join(' ').toLocaleLowerCase('en-US').includes(q));return `${summary()}<div class="search">${I('search')}<input id="${d}-search" aria-label="Search stock" placeholder="Item, part number or location" value="${a(ui[d].query)}" oninput="search('${d}',this.value)"></div><div class="cardgrid">${visible.map(x=>card(x,d)).join('')||`<div class="card empty"><div class="bigicon">${I('search')}</div><h3>No matches</h3><p>Try an item, part number, category or truck location.</p></div>`}</div>`}
function restock(d){let rows=low();return `<div class="sectionhead"><span>${rows.length} item${rows.length===1?'':'s'} to buy</span><button class="share" aria-label="Export restock CSV" onclick="exportCSV('${d}','restock')">${I('box-arrow-up')}CSV</button></div><div class="cardgrid">${rows.length?rows.map(x=>`<article class="card restock-card"><div class="itemtop"><div><div class="name">${h(x.name)}</div><div class="part">${h(x.part)}</div><div class="meta">${h(x.loc||x.cat)}</div></div><div class="buy"><strong>Buy ${Math.max(0,x.to-x.qty)}</strong><span>${x.qty} on truck</span></div></div><button class="primary" onclick="openStock('${d}',${x.id})">Stock</button></article>`).join(''):`<div class="card empty"><div class="bigicon">${I('check-circle')}</div><h3>Nothing to restock</h3><p>Items appear here automatically at their restock level.</p></div>`}</div>`}
function canReverse(e){if(!e||e.reversed||e.kind==='Created'||e.kind==='Reversed'||!Number.isInteger(e.delta)||e.delta===0)return false;let x=items.find(x=>x.id===e.itemID);return !!x&&safeAdd(x.qty,-e.delta)!==null}
function activity(d){return `<div class="sectionhead"><span>Newest first</span><button class="share" aria-label="Export activity CSV" onclick="exportCSV('${d}','activity')">${I('box-arrow-up')}CSV</button></div><div class="cardgrid">${events.map(e=>`<article class="card"><div class="event"><div><div class="name">${h(e.item)}</div><small>${h(e.kind)}</small><small>${h(e.time)}</small></div><div class="delta ${e.delta<0?'neg':''}">${e.delta>0?'+':''}${e.delta}<small>Balance ${e.result}</small></div></div>${e.reversed?'<div class="reversed">Reversed</div>':canReverse(e)?`<button class="reverse" onclick="reverseEvent('${d}',${e.id})">Reverse</button>`:e.kind!=='Created'&&e.kind!=='Reversed'?'<div class="reversed">Unavailable</div>':''}</article>`).join('')||`<div class="card empty"><h3>No activity yet</h3></div>`}</div>`}
function toolbar(d){let title=ui[d].tab[0].toUpperCase()+ui[d].tab.slice(1);return `<header class="toolbar"><h2>${title}</h2><div class="nav-actions">${ui[d].tab==='stock'?`<button class="iconbtn" title="Add" aria-label="Add item" onclick="openAdd('${d}')">${I('plus-lg')}</button>`:''}<button class="iconbtn" title="Settings" aria-label="Settings" onclick="openModal('${d}','settings')">${I('gear')}</button></div></header>`}
function tabs(d){return `<nav class="tabbar" aria-label="Primary">${['stock','restock','activity'].map(t=>`<button class="tab ${ui[d].tab===t?'active':''}" ${ui[d].tab===t?'aria-current="page"':''} onclick="setTab('${d}','${t}')"><b>${icon[t]}</b>${t[0].toUpperCase()+t.slice(1)}${t==='restock'&&low().length?`<span class="badge">${low().length}</span>`:''}</button>`).join('')}</nav>`}
function sidebar(d){return `<aside class="sidebar"><div class="brand">HVAC Restock</div>${['stock','restock','activity'].map(t=>`<button class="side-btn ${ui[d].tab===t?'active':''}" ${ui[d].tab===t?'aria-current="page"':''} onclick="setTab('${d}','${t}')"><span>${icon[t]}</span>${t[0].toUpperCase()+t.slice(1)}${t==='restock'&&low().length?`<span class="count">${low().length}</span>`:''}</button>`).join('')}<div class="side-bottom"><button class="side-btn" onclick="openModal('${d}','settings')"><span>${I('gear')}</span>Settings</button></div></aside>`}
function current(d){return ui[d].tab==='stock'?stock(d):ui[d].tab==='restock'?restock(d):activity(d)}
function render(d){let root=document.getElementById(d);root.innerHTML=statusbar()+(d==='phone'?`<div class="appbody">${toolbar(d)}<main class="content">${current(d)}</main>${tabs(d)}</div>`:`<div class="appbody">${sidebar(d)}<section class="mainpane">${toolbar(d)}<main class="content">${current(d)}</main></section></div>`)+(ui[d].modal?modal(d,ui[d].modal):'');}
function rerender(){render('phone');render('tablet')}
function setTab(d,t){ui[d].tab=t;ui[d].modal=null;ui[d].edit=null;render(d)}
function search(d,v){ui[d].query=v;render(d);queueMicrotask(()=>{let el=document.getElementById(`${d}-search`);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}})}
function openModal(d,m){ui[d].modal=m;render(d)}
function closeModal(d){if(ui[d].modal==='unlock'&&ui[d].returnModal){ui[d].modal=ui[d].returnModal;ui[d].returnModal=null}else{ui[d].modal=null;ui[d].edit=null;ui[d].returnModal=null}render(d)}
function useOne(d,id){let x=items.find(x=>x.id===id);if(!x){toast(d,'That item is no longer available');return}let qty=safeAdd(x.qty,-1);if(qty===null){toast(d,'There is not enough stock for that change');return}x.qty=qty;events.unshift(makeEvent(x,'Used',-1,qty));rerender();toast(d,`Used ${x.name}`)}
function addOne(d,id){let x=items.find(x=>x.id===id);if(!x){toast(d,'That item is no longer available');return}let qty=safeAdd(x.qty,1);if(qty===null){toast(d,'Maximum quantity reached');return}x.qty=qty;events.unshift(makeEvent(x,'Adjusted',1,qty));rerender();toast(d,`Added one ${x.name}`)}
function reverseEvent(d,id){let e=events.find(x=>x.id===id);if(!canReverse(e)){toast(d,'That change cannot be reversed');return}let x=items.find(x=>x.id===e.itemID),qty=safeAdd(x.qty,-e.delta);if(qty===null){toast(d,'That change cannot be reversed');return}x.qty=qty;e.reversed=true;events.unshift(makeEvent(x,'Reversed',-e.delta,qty,true));rerender();toast(d,'Stock change reversed')}
function openAdd(d){if(!unlocked&&items.length>=FREE_LIMIT){openModal(d,'unlock');return}ui[d].edit=null;openModal(d,'edit')}
function openEdit(d,id){if(!items.some(x=>x.id===id)){toast(d,'That item is no longer available');return}ui[d].edit=id;openModal(d,'edit')}
function openStock(d,id){if(!items.some(x=>x.id===id)){toast(d,'That item is no longer available');return}ui[d].edit=id;openModal(d,'stock')}
function head(d,title,save){return `<div class="sheethead"><button onclick="closeModal('${d}')">Cancel</button><strong>${h(title)}</strong>${save?`<button onclick="${save}">Save</button>`:'<span></span>'}</div>`}
function modal(d,m){if(m==='settings')return settingsModal(d);if(m==='unlock')return unlockModal(d);if(m==='import')return importModal(d);if(m==='stock')return stockModal(d);return editModal(d)}
function editModal(d){let requested=ui[d].edit,x=items.find(x=>x.id===requested);if(requested!==null&&!x){ui[d].modal=null;ui[d].edit=null;return ''}let edit=!!x;x=x||{name:'',part:'',cat:'Capacitor',loc:'',qty:1,at:1,to:2};return `<div class="sheetback"><section class="sheet">${head(d,edit?'Edit item':'Add item',`saveItem('${d}')`)}<div class="sheetbody"><div class="formtitle">Item</div><div class="formsec"><div class="row"><label>Name</label><input id="${d}-name" maxlength="120" value="${a(x.name)}" placeholder="Required"></div><div class="row"><label>Part number</label><input id="${d}-part" maxlength="120" value="${a(x.part)}" placeholder="Optional"></div><div class="row"><label>Category</label><select id="${d}-cat">${['Capacitor','Contactor','Fuse','Filter','Motor','Fitting','Thermostat','Consumable','Other'].map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></div><div class="row"><label>Truck location</label><input id="${d}-loc" maxlength="120" value="${a(x.loc)}" placeholder="Optional"></div></div><div class="formtitle">Quantities</div><div class="formsec">${quantityRow(d,'On truck','qty',x.qty)}${quantityRow(d,'Restock at','at',x.at)}${quantityRow(d,'Restock to','to',x.to)}</div>${edit?`<button class="danger full" onclick="deleteItem('${d}',${x.id})">Delete item</button>`:''}</div></section></div>`}
function quantityRow(d,label,key,v){return `<div class="row"><label>${label}</label><div class="stepper"><button aria-label="Decrease ${label}" onclick="step('${d}','${key}',-1)">${I('dash-lg')}</button><b id="${d}-${key}">${v}</b><button aria-label="Increase ${label}" onclick="step('${d}','${key}',1)">${I('plus-lg')}</button></div></div>`}
function step(d,key,n){let el=document.getElementById(`${d}-${key}`);if(!el)return;let minimum=key==='to'||key==='receive'?1:0;el.textContent=Math.min(MAX_QUANTITY,Math.max(minimum,Number(el.textContent)+n))}
function saveItem(d){let nameEl=document.getElementById(`${d}-name`);if(!nameEl){toast(d,'The editor is no longer available');return}let data={name:normalize(nameEl.value),part:normalize(document.getElementById(`${d}-part`).value),cat:document.getElementById(`${d}-cat`).value,loc:normalize(document.getElementById(`${d}-loc`).value),qty:Number(document.getElementById(`${d}-qty`).textContent),at:Number(document.getElementById(`${d}-at`).textContent),to:Number(document.getElementById(`${d}-to`).textContent)};if(!data.name){toast(d,'Enter an item name');return}if(!validQuantity(data.qty)||!validQuantity(data.at)||!validQuantity(data.to)||data.to<=data.at){toast(d,'Restock to must exceed Restock at');return}let requested=ui[d].edit,x=items.find(x=>x.id===requested);if(requested!==null&&!x){toast(d,'That item is no longer available');closeModal(d);return}if(items.some(other=>other.id!==requested&&duplicateKey(other)===duplicateKey(data))){toast(d,'That item already exists');return}if(!x&&!unlocked&&items.length>=FREE_LIMIT){ui[d].returnModal='edit';openModal(d,'unlock');return}if(x){let delta=data.qty-x.qty;Object.assign(x,data);if(delta)events.unshift(makeEvent(x,'Adjusted',delta,x.qty))}else{data.id=newID();items.push(data);events.unshift(makeEvent(data,'Created',data.qty,data.qty))}ui[d].modal=null;ui[d].edit=null;rerender();toast(d,x?'Item updated':'Item added')}
function deleteItem(d,id){let x=items.find(x=>x.id===id);if(!x){toast(d,'That item is no longer available');closeModal(d);return}if(!confirm('Delete this item? Activity history will remain available.'))return;items=items.filter(item=>item.id!==id);ui[d].modal=null;ui[d].edit=null;rerender();toast(d,`Deleted ${x.name}`)}
function stockModal(d){let x=items.find(x=>x.id===ui[d].edit);if(!x){ui[d].modal=null;ui[d].edit=null;return ''}let suggest=Math.max(1,Math.min(MAX_QUANTITY-x.qty,x.to-x.qty));return `<div class="sheetback"><section class="sheet">${head(d,'Stock item','')}<div class="sheetbody"><div class="formsec"><div class="row"><label>Item</label><b style="margin-left:auto;text-align:right">${h(x.name)}</b></div><div class="row"><label>On truck</label><b style="margin-left:auto">${x.qty}</b></div><div class="row"><label>Restock to</label><b style="margin-left:auto">${x.to}</b></div>${quantityRow(d,'Quantity received','receive',suggest)}</div><button class="primary full" onclick="receiveStock('${d}',${x.id})">Stock</button></div></section></div>`}
function receiveStock(d,id){let x=items.find(x=>x.id===id),el=document.getElementById(`${d}-receive`);if(!x||!el){toast(d,'That item is no longer available');return}let n=Number(el.textContent),qty=safeAdd(x.qty,n);if(n<1||qty===null){toast(d,'Quantity must stay between 0 and 999,999');return}x.qty=qty;events.unshift(makeEvent(x,'Stocked',n,qty));ui[d].modal=null;ui[d].edit=null;rerender();toast(d,`Stocked ${x.name}`)}
function settingsModal(d){let chevron=I('chevron-right');return `<div class="sheetback"><section class="sheet">${head(d,'Settings','')}<div class="sheetbody"><div class="formtitle">Lifetime access</div><div class="formsec"><button class="settingsrow" onclick="${unlocked?`toast('${d}','Lifetime access is active')`:`openModal('${d}','unlock')`}"><span>Status</span><span>${unlocked?'Unlocked':'Free — 10 items'} ${chevron}</span></button><button class="settingsrow" onclick="toast('${d}','No additional purchase found in preview')"><span>Restore purchase</span><span>${chevron}</span></button></div><div class="formtitle">Your data</div><div class="formsec"><button class="settingsrow" onclick="openModal('${d}','import')"><span class="rowlabel">${I('file-earmark-arrow-down')}Import inventory CSV</span><span>${chevron}</span></button><button class="settingsrow" onclick="exportCSV('${d}','inventory')"><span class="rowlabel">${I('file-earmark-arrow-up')}Export inventory CSV</span><span>${chevron}</span></button></div><div class="formtitle">About</div><div class="formsec"><button class="settingsrow" onclick="toast('${d}','Privacy policy opens from the production app')"><span>Privacy policy</span><span>${chevron}</span></button><button class="settingsrow" onclick="toast('${d}','Terms open from the production app')"><span>Terms</span><span>${chevron}</span></button><div class="settingsrow"><span>Purchase</span><span>One time</span></div><div class="settingsrow"><span>Accounts, ads, analytics</span><span>None</span></div></div><button class="danger full" onclick="resetPreview('${d}')">Reset preview data</button></div></section></div>`}
function unlockModal(d){let check=I('check2');return `<div class="sheetback"><section class="sheet">${head(d,'Lifetime unlock','')}<div class="sheetbody"><h2 style="margin:4px 0 6px;font-size:27px">Unlimited truck stock</h2><p style="margin:0 0 14px;color:var(--muted)">Keep every part you carry in one private, offline restock list.</p><div class="formsec" style="padding:5px 14px"><div class="feature">${check}Unlimited items</div><div class="feature">${check}Automatic restock list</div><div class="feature">${check}Reversible activity history</div><div class="feature">${check}CSV import and export</div></div><div class="pricebox"><span><b style="font-size:15px">Lifetime access</b><br><small>One payment. No subscription.</small></span><b>$14.99</b></div><button class="primary full" onclick="purchasePreview('${d}')">${unlocked?'Unlocked':'Unlock for $14.99'}</button><button class="secondary full" style="margin-top:9px" onclick="toast('${d}','Restore checked')">Restore purchase</button><p class="fineprint">Existing records, activity, reversal and exports remain available without unlocking.</p></div></section></div>`}
function importAnalysis(){let keys=new Set(items.map(duplicateKey)),duplicates=0,newCount=0;for(let row of importRows){let key=duplicateKey(row);if(keys.has(key))duplicates++;else{keys.add(key);newCount++}}return{duplicates,newCount,blocked:!unlocked&&items.length+newCount>FREE_LIMIT}}
function importModal(d){let plan=importAnalysis();return `<div class="sheetback"><section class="sheet">${head(d,'Review import','')}<div class="sheetbody"><div class="notice">Previewing HVAC-Inventory.csv. Invalid rows are identified before anything changes.</div><div class="formsec"><div class="settingsrow"><span>Valid rows</span><span>${importRows.length}</span></div><div class="settingsrow"><span>Rows with errors</span><span>1</span></div><div class="settingsrow"><span>Duplicate matches</span><span>${plan.duplicates}</span></div><div class="settingsrow"><span>Merge duplicate matches</span><span>On</span></div></div>${plan.blocked?`<div class="notice">This import creates ${plan.newCount} new items and exceeds the 10-item free limit. Lifetime access is a one-time purchase.</div>`:''}<div class="formtitle">Items to import</div><div class="formsec">${importRows.map(row=>`<div class="row"><span>${h(row.name)}</span><b style="margin-left:auto">${row.qty}</b></div>`).join('')}</div><div class="notice">Line 5 will be skipped: Restock-to quantity must exceed the restock level.</div><button class="primary full" onclick="${plan.blocked?`requestImportUnlock('${d}')`:`applyImport('${d}')`}">${plan.blocked?'Unlock to import':`Import ${importRows.length} rows`}</button></div></section></div>`}
function requestImportUnlock(d){ui[d].returnModal='import';openModal(d,'unlock')}
function applyImport(d){let plan=importAnalysis();if(plan.blocked){requestImportUnlock(d);return}let nextItems=structuredClone(items),nextEvents=structuredClone(events);for(let row of importRows){let existing=nextItems.find(x=>duplicateKey(x)===duplicateKey(row));if(existing){let qty=safeAdd(existing.qty,row.qty);if(qty===null){toast(d,`Cannot import ${row.name}: maximum quantity exceeded`);return}existing.qty=qty;existing.at=row.at;existing.to=row.to;nextEvents.unshift(makeEvent(existing,'Imported',row.qty,qty))}else{let item={...row,id:newID()};nextItems.push(item);nextEvents.unshift(makeEvent(item,'Imported',item.qty,item.qty))}}items=nextItems;events=nextEvents;ui[d].modal=null;ui[d].edit=null;rerender();toast(d,`Imported ${importRows.length} rows`)}
function csvCell(value){let raw=String(value??''),safe=/^[=+\-@]/.test(raw)?"'"+raw:raw;return `"${safe.replaceAll('"','""')}"`}
function exportCSV(d,type){let rows=type==='restock'?low():items,csv='Item,Part number,Category,On hand,Restock level,Restock to,Buy,Location\r\n'+rows.map(x=>[x.name,x.part,x.cat,x.qty,x.at,x.to,Math.max(0,x.to-x.qty),x.loc].map(csvCell).join(',')).join('\r\n');if(type==='activity')csv='Date,Item,Action,Change,Result,Reversed\r\n'+events.map(e=>[e.time,e.item,e.kind,e.delta,e.result,e.reversed?'Yes':'No'].map(csvCell).join(',')).join('\r\n');let link=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.href=url;link.download=`HVAC-${type}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),0);toast(d,'CSV prepared')}
function purchasePreview(d){unlocked=true;ui[d].modal=ui[d].returnModal;ui[d].returnModal=null;rerender();toast(d,'Lifetime access unlocked in preview')}
function resetPreview(d){items=structuredClone(seed);events=structuredClone(seedEvents);unlocked=false;nextID=1000;for(let state of Object.values(ui)){state.modal=null;state.edit=null;state.returnModal=null;state.query=''}rerender();toast(d,'Preview data reset')}
function toast(d,msg){let root=document.getElementById(d),old=root.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;root.appendChild(el);setTimeout(()=>el.remove(),2200)}
rerender();
</script>
</body>
</html>
