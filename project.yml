name: HVACRestock
options:
  bundleIdPrefix: com.worksbienstudios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: 49SQ3XQ68Q
    CODE_SIGN_STYLE: Automatic
targets:
  HVACRestockCore:
    type: library.static
    platform: iOS
    sources:
      - Sources/HVACRestockCore
    settings:
      base:
        PRODUCT_MODULE_NAME: HVACRestockCore
  HVACRestockApp:
    type: library.static
    platform: iOS
    sources:
      - Sources/HVACRestockApp
    dependencies:
      - target: HVACRestockCore
    settings:
      base:
        PRODUCT_MODULE_NAME: HVACRestockApp
  HVACRestock:
    type: application
    platform: iOS
    sources:
      - path: AppHost
        excludes:
          - Assets.xcassets
          - Info.plist
          - PrivacyInfo.xcprivacy
    resources:
      - AppHost/Assets.xcassets
      - AppHost/PrivacyInfo.xcprivacy
    dependencies:
      - target: HVACRestockApp
      - target: HVACRestockCore
    settings:
      base:
        PRODUCT_NAME: HVAC Restock
        PRODUCT_BUNDLE_IDENTIFIER: com.worksbienstudios.hvacrestock
        INFOPLIST_FILE: AppHost/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  HVACRestockCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HVACRestockCoreTests
    dependencies:
      - target: HVACRestockCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HVACRestock:
    build:
      targets:
        HVACRestock: all
        HVACRestockCoreTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - HVACRestockCoreTests
    archive:
      config: Release
