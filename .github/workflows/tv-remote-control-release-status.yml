name: TV Remote Control Release Status

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tv-remote-control-release-status.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lrodeveloperr/HVA-restock-ios
          ref: release/tv-remote-control
      - name: Query App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          (( ${#missing[@]} == 0 )) || { echo "Missing Actions secrets: ${missing[*]}" >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          jwt="$(ruby Scripts/app-store-connect-jwt.rb "$key_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          auth="Authorization: Bearer $jwt"
          response="$RUNNER_TEMP/builds.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" \
            --data-urlencode 'filter[app]=6809810611' \
            --data-urlencode 'sort=-uploadedDate' \
            --data-urlencode 'limit=5' \
            'https://api.appstoreconnect.apple.com/v1/builds' -o "$response"
          ruby -rjson -e '
            builds=JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "No TestFlight builds found yet" if builds.empty?
            builds.each do |build|
              a=build.fetch("attributes")
              puts [
                "build=#{a["version"]}",
                "uploaded=#{a["uploadedDate"]}",
                "expired=#{a["expired"]}",
                "processingState=#{a["processingState"]}"
              ].join(" ")
            end
          ' "$response"

          iaps="$RUNNER_TEMP/iaps.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" \
            --data-urlencode 'limit=200' \
            'https://api.appstoreconnect.apple.com/v1/apps/6809810611/inAppPurchasesV2' -o "$iaps"
          ruby -rjson -e '
            items=JSON.parse(File.read(ARGV[0])).fetch("data")
            puts "iapCount=#{items.length}"
            items.each do |item|
              a=item.fetch("attributes")
              puts [
                "iapId=#{item["id"]}",
                "productId=#{a["productId"]}",
                "type=#{a["inAppPurchaseType"]}",
                "state=#{a["state"]}",
                "referenceName=#{a["name"]}"
              ].join(" ")
            end
          ' "$iaps"

          price_schedule="$RUNNER_TEMP/app-price-schedule.json"
          price_status="$(curl --silent --show-error -o "$price_schedule" -w '%{http_code}' -H "$auth" \
            'https://api.appstoreconnect.apple.com/v1/apps/6809810611/appPriceSchedule')"
          echo "appPriceScheduleStatus=$price_status"
          if [[ "$price_status" == 200 ]]; then
            ruby -rjson -e 'item=JSON.parse(File.read(ARGV[0])).fetch("data"); puts "appPriceScheduleId=#{item["id"]}"' "$price_schedule"
            app_prices="$RUNNER_TEMP/app-prices.json"
            app_prices_status="$(curl --silent --show-error --get -o "$app_prices" -w '%{http_code}' -H "$auth" \
              --data-urlencode 'filter[territory]=USA' \
              --data-urlencode 'include=appPricePoint' \
              --data-urlencode 'limit=200' \
              "https://api.appstoreconnect.apple.com/v1/appPriceSchedules/6809810611/manualPrices")"
            if [[ "$app_prices_status" == 404 ]]; then
              echo "appUSAPrices=free"
            elif [[ "$app_prices_status" == 200 ]]; then
              ruby -rjson -e '
                payload=JSON.parse(File.read(ARGV[0]))
                points=(payload["included"] || []).select { |item| item["type"] == "appPricePoints" }
                puts "appUSAPrices=#{points.map { |item| item.dig("attributes","customerPrice") }.compact.join(",")}"
              ' "$app_prices"
            else
              cat "$app_prices" >&2
              exit 1
            fi
          fi

          availability="$RUNNER_TEMP/app-availability.json"
          availability_status="$(curl --silent --show-error -o "$availability" -w '%{http_code}' -H "$auth" \
            'https://api.appstoreconnect.apple.com/v1/apps/6809810611/appAvailabilityV2')"
          echo "appAvailabilityStatus=$availability_status"
          if [[ "$availability_status" == 200 ]]; then
            ruby -rjson -e 'item=JSON.parse(File.read(ARGV[0])).fetch("data"); puts "appAvailabilityId=#{item["id"]} newTerritories=#{item.dig("attributes","availableInNewTerritories")}"' "$availability"
          fi

