name: Remote for Vizio TV Controller TestFlight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD TV REMOTE to confirm production-logic upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tv-remote-control-testflight-dispatch
  cancel-in-progress: false

jobs:
  upload:
    uses: lrodeveloperr/tv-remote-control-ios/.github/workflows/testflight.yml@30d4239200d081bd4da44ec72b78b587f605d743
    with:
      confirmation: ${{ inputs.confirmation }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
