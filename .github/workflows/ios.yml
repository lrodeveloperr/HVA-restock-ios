name: Validate TV Remote Control iOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tv-remote-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-analyze:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Validate project and localizations
        run: |
          plutil -lint VizioRemote/Info.plist VizioRemote/PrivacyInfo.xcprivacy
          python3 -m py_compile MockTV/mock_smartcast.py
          test "$(find VizioRemote -name Localizable.strings | wc -l | tr -d ' ')" = "3"
          while IFS= read -r file; do plutil -lint "$file"; done < <(find VizioRemote -name '*.strings' -print)
      - name: Build Debug and Release without signing
        run: |
          xcodebuild \
            -project VizioRemote.xcodeproj \
            -scheme VizioRemote \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project VizioRemote.xcodeproj \
            -scheme VizioRemote \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify Release excludes screenshot harness
        run: |
          release_binary="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/VizioRemote.app/VizioRemote"
          test -f "$release_binary"
          if rg --text 'SCREENSHOT_MODE|SCREENSHOT_TRIAL_PRICE|SCREENSHOT_LIFETIME_PRICE' "$release_binary"; then
            echo 'Release binary contains DEBUG-only screenshot controls.' >&2
            exit 1
          fi
      - name: Analyze
        run: |
          xcodebuild \
            -project VizioRemote.xcodeproj \
            -scheme VizioRemote \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            analyze

  unit-tests:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select stable StoreKit test runtime
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available
      - name: Run unit tests
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project VizioRemote.xcodeproj \
            -scheme VizioRemote \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -destination-timeout 300 \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -resultBundlePath "$RUNNER_TEMP/VizioRemoteTests.xcresult" \
            test
      - name: Preserve XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: VizioRemoteTests-xcresult
          path: ${{ runner.temp }}/VizioRemoteTests.xcresult
          if-no-files-found: warn
          retention-days: 14
