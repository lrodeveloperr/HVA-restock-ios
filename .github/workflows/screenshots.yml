name: Generate iPhone and iPad Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VizioRemote/**
      - VizioRemote.xcodeproj/**
      - .github/workflows/screenshots.yml

permissions:
  contents: read

concurrency:
  group: tv-remote-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Build screenshot app
        run: |
          xcodebuild \
            -project VizioRemote.xcodeproj \
            -scheme VizioRemote \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture real simulator screens
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten.select { |d| d["isAvailable"] }
            phone = devices.find { |d| d["name"].include?("Pro Max") } || devices.find { |d| d["name"].start_with?("iPhone") }
            tablet = devices.find { |d| d["name"].include?("iPad Pro") && d["name"].include?("13-inch") } || devices.find { |d| d["name"].start_with?("iPad") }
            abort "No available iPhone simulator" unless phone
            abort "No available iPad simulator" unless tablet
            puts phone.fetch("udid")
            puts tablet.fetch("udid")
            warn "iPhone simulator: #{phone.fetch("name")}" 
            warn "iPad simulator: #{tablet.fetch("name")}" 
          ' > "$RUNNER_TEMP/simulators.txt"
          PHONE_ID="$(sed -n '1p' "$RUNNER_TEMP/simulators.txt")"
          IPAD_ID="$(sed -n '2p' "$RUNNER_TEMP/simulators.txt")"
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/VizioRemote.app"
          BUNDLE_ID="com.worksbienstudios.clearmote"
          mkdir -p Screenshots

          boot_with_timeout() {
            local device_id="$1"
            local elapsed=0
            xcrun simctl boot "$device_id" 2>/dev/null || true
            xcrun simctl bootstatus "$device_id" -b &
            local boot_pid=$!
            while kill -0 "$boot_pid" 2>/dev/null; do
              if (( elapsed >= 240 )); then
                echo "Simulator $device_id did not finish booting within 240 seconds." >&2
                kill "$boot_pid" 2>/dev/null || true
                wait "$boot_pid" 2>/dev/null || true
                return 1
              fi
              sleep 5
              elapsed=$((elapsed + 5))
            done
            wait "$boot_pid"
          }

          capture() {
            local device_id="$1"
            local device_label="$2"
            local mode="$3"
            xcrun simctl terminate "$device_id" "$BUNDLE_ID" 2>/dev/null || true
            SIMCTL_CHILD_SCREENSHOT_MODE="$mode" \
            SIMCTL_CHILD_SCREENSHOT_TRIAL_PRICE='$0.00' \
            SIMCTL_CHILD_SCREENSHOT_LIFETIME_PRICE='$2.99' \
              xcrun simctl launch --terminate-running-process "$device_id" "$BUNDLE_ID"
            sleep 3
            xcrun simctl io "$device_id" screenshot "Screenshots/${device_label}-${mode}.png"
          }

          for device_id in "$PHONE_ID" "$IPAD_ID"; do
            boot_with_timeout "$device_id"
            xcrun simctl install "$device_id" "$APP_PATH"
          done

          for mode in connection remote purchase; do
            capture "$PHONE_ID" iphone "$mode"
            capture "$IPAD_ID" ipad "$mode"
          done

          sips -g pixelWidth -g pixelHeight Screenshots/*.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tv-remote-app-store-screenshots
          path: Screenshots/*.png
          if-no-files-found: error
          retention-days: 30
