name: Remote for Vizio TV Controller TestFlight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD TV REMOTE to confirm production-logic upload
        required: true
        type: string
  workflow_call:
    inputs:
      confirmation:
        description: Exact protected upload confirmation
        required: true
        type: string
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_P12:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: tv-remote-control-testflight
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: com.worksbienstudios.clearmote
  APPLE_TEAM_ID: 49SQ3XQ68Q
  APP_NAME: 'Remote for Vizio TV Controller'
  APP_SKU: tv-remote-control-ios
  PROVISIONING_PROFILE_NAME: TV Remote Control App Store CI
  SCHEME: VizioRemote
  ARCHIVE_PATH: ${{ github.workspace }}/build/VizioRemote.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lrodeveloperr/HVA-restock-ios
          ref: release/tv-remote-control
      - name: Confirm production upload
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$CONFIRMATION" == "UPLOAD TV REMOTE" ]] || { echo 'Confirmation must exactly match UPLOAD TV REMOTE.' >&2; exit 1; }
          build_number="$(date -u +%y%m%d%H%M).${GITHUB_RUN_NUMBER}"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          xcodebuild -version
      - name: Validate source metadata
        run: |
          plutil -lint VizioRemote/Info.plist VizioRemote/PrivacyInfo.xcprivacy
      - name: Prepare App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          (( ${#missing[@]} == 0 )) || { echo "Missing Actions secrets: ${missing[*]}" >&2; exit 1; }
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Ensure Apple bundle ID and App Store record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          jwt="$(ruby Scripts/app-store-connect-jwt.rb "$ASC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          echo "ASC_JWT=$jwt" >> "$GITHUB_ENV"
          auth="Authorization: Bearer $jwt"
          bundle_json="$RUNNER_TEMP/bundle.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[identifier]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$bundle_json")"
          if [[ "$count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"bundleIds",attributes:{identifier:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),platform:"IOS"}})' > "$RUNNER_TEMP/create-bundle.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-bundle.json" 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          elif [[ "$count" != "1" ]]; then
            echo "Bundle ID lookup was ambiguous." >&2
            exit 1
          fi
          bundle_resource_id="$(ruby -rjson -e 'd=JSON.parse(File.read(ARGV[0])).fetch("data"); d=d.fetch(0) if d.is_a?(Array); puts d.fetch("id")' "$bundle_json")"
          echo "BUNDLE_RESOURCE_ID=$bundle_resource_id" >> "$GITHUB_ENV"

          app_json="$RUNNER_TEMP/app.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[bundleId]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          app_count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$app_json")"
          if [[ "$app_count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"apps",attributes:{bundleId:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),primaryLocale:"en-US",sku:ENV.fetch("APP_SKU")}})' > "$RUNNER_TEMP/create-app.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-app.json" 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          elif [[ "$app_count" != "1" ]]; then
            echo "App lookup was ambiguous." >&2
            exit 1
          fi
      - name: Install distribution signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_P12" ]] || { echo 'Missing IOS_DISTRIBUTION_CERTIFICATE_P12.' >&2; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || { echo 'Missing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD.' >&2; exit 1; }
          cert_path="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > "$cert_path"
          chmod 600 "$cert_path"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain_path" | grep 'Apple Distribution'
          profile_json="$RUNNER_TEMP/profiles.json"
          auth="Authorization: Bearer $ASC_JWT"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[name]=$PROVISIONING_PROFILE_NAME" --data-urlencode 'filter[profileState]=ACTIVE' --data-urlencode 'limit=200' 'https://api.appstoreconnect.apple.com/v1/profiles' -o "$profile_json"
          profile_count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$profile_json")"
          if [[ "$profile_count" == "0" ]]; then
            cert_json="$RUNNER_TEMP/certificates.json"
            curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode 'limit=200' 'https://api.appstoreconnect.apple.com/v1/certificates' -o "$cert_json"
            certificate_id="$(ruby -rjson -rtime -e 'data=JSON.parse(File.read(ARGV[0])).fetch("data"); cert=data.select{|x| %w[DISTRIBUTION IOS_DISTRIBUTION].include?(x.dig("attributes","certificateType")) && Time.parse(x.dig("attributes","expirationDate")) > Time.now}.max_by{|x| Time.parse(x.dig("attributes","expirationDate"))}; abort "No active iOS distribution certificate in Apple account" unless cert; puts cert.fetch("id")' "$cert_json")"
            BUNDLE_RESOURCE_ID="$BUNDLE_RESOURCE_ID" CERTIFICATE_ID="$certificate_id" ruby -rjson -e 'puts JSON.generate(data:{type:"profiles",attributes:{name:ENV.fetch("PROVISIONING_PROFILE_NAME"),profileType:"IOS_APP_STORE"},relationships:{bundleId:{data:{type:"bundleIds",id:ENV.fetch("BUNDLE_RESOURCE_ID")}},certificates:{data:[{type:"certificates",id:ENV.fetch("CERTIFICATE_ID")}]}}})' > "$RUNNER_TEMP/create-profile.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-profile.json" 'https://api.appstoreconnect.apple.com/v1/profiles' -o "$profile_json"
          fi
          PROVISIONING_PROFILE_NAME="$PROVISIONING_PROFILE_NAME" ruby -rjson -rbase64 -rtime -e 'doc=JSON.parse(File.read(ARGV[0])); raw=doc.fetch("data"); data=raw.is_a?(Array) ? raw : [raw]; expected=ENV.fetch("PROVISIONING_PROFILE_NAME"); data.sort_by{|item| [item.dig("attributes", "name") == expected ? 0 : 1, -Time.parse(item.dig("attributes", "expirationDate")).to_i]}.each_with_index{|item,index| path=File.join(ARGV[1], "candidate-profile-#{index}.mobileprovision"); File.binwrite(path, Base64.decode64(item.fetch("attributes").fetch("profileContent"))); puts path}' "$profile_json" "$RUNNER_TEMP" > "$RUNNER_TEMP/profile-candidates.txt"
          profile_path=""
          while IFS= read -r candidate; do
            candidate_plist="$candidate.plist"
            security cms -D -i "$candidate" > "$candidate_plist"
            candidate_app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$candidate_plist" 2>/dev/null || true)"
            if [[ "$candidate_app_identifier" == "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]]; then
              profile_path="$candidate"
              cp "$candidate_plist" "$RUNNER_TEMP/profile.plist"
              break
            fi
          done < "$RUNNER_TEMP/profile-candidates.txt"
          if [[ -z "$profile_path" ]]; then
            echo "No active provisioning profile matches this app." >&2
            exit 1
          fi
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          [[ "$app_identifier" == "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]]
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile_path" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$profile_uuid" >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        run: |
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          xcodebuild -project VizioRemote.xcodeproj -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" clean archive
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string "Apple Distribution"' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_UUID" "$export_options"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist "$export_options"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          ditto -x -k "$IPA_PATH" "$verify"
          app="$(find "$verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist")" == "false" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist")" == "AppIcon" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "$app/Info.plist")" == "_googlecast._tcp" ]]
          [[ -f "$app/AppIcon60x60@2x.png" ]]
          [[ -f "$app/AppIcon76x76@2x.png" ]]

          inspection="$RUNNER_TEMP/signed-inspection"
          mkdir -p "$inspection"
          git rev-parse HEAD > "$inspection/source-commit.txt"
          cp "$app/Info.plist" "$inspection/Info.plist"
          test -f "$app/PrivacyInfo.xcprivacy"
          cp "$app/PrivacyInfo.xcprivacy" "$inspection/PrivacyInfo.xcprivacy"
          codesign -d --entitlements :- "$app" > "$inspection/signed-entitlements.plist"
          plutil -lint "$inspection/signed-entitlements.plist" "$inspection/PrivacyInfo.xcprivacy"
          signed_multicast="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.multicast' "$inspection/signed-entitlements.plist" 2>/dev/null || true)"
          if [[ -n "$signed_multicast" ]]; then
            echo "Signed app unexpectedly contains multicast entitlement." >&2
            exit 1
          fi
          [[ "$(plutil -extract NSPrivacyTracking raw -o - "$inspection/PrivacyInfo.xcprivacy")" == "false" ]]
          plutil -extract NSPrivacyTrackingDomains json -o - "$inspection/PrivacyInfo.xcprivacy" | ruby -rjson -e 'abort "Tracking domains are not empty" unless JSON.parse(STDIN.read).empty?'
          plutil -extract NSPrivacyCollectedDataTypes json -o - "$inspection/PrivacyInfo.xcprivacy" | ruby -rjson -e 'abort "Collected data types are not empty" unless JSON.parse(STDIN.read).empty?'
          plutil -convert json -o - "$inspection/PrivacyInfo.xcprivacy" | ruby -rjson -e 'doc=JSON.parse(STDIN.read); entry=doc.fetch("NSPrivacyAccessedAPITypes").find{|item| item["NSPrivacyAccessedAPIType"]=="NSPrivacyAccessedAPICategoryUserDefaults"}; abort "Missing required UserDefaults reason CA92.1" unless entry && entry.fetch("NSPrivacyAccessedAPITypeReasons").include?("CA92.1")'
          {
            find "$app" -type d -name '*.framework' -prune -print
            find "$app" -type f -name '*.dylib' -print
          } | sort > "$inspection/embedded-code.txt"
          ruby -e 'bad=File.readlines(ARGV[0], chomp:true).reject{|path| File.basename(path).match?(/\Alibswift.*\.dylib\z/)}; abort "Unexpected embedded code:\n#{bad.join("\n")}" unless bad.empty?' "$inspection/embedded-code.txt"
          echo "SIGNED_INSPECTION_PATH=$inspection" >> "$GITHUB_ENV"
      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TV-Remote-Control-TestFlight-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.SIGNED_INSPECTION_PATH }}
          retention-days: 14
